; Настройки мода для Drakensang и Drakensang: The River of Time (dinput8.dll).
; Клавиши: F1..F12, A..Z, 0..9, Space, Enter, Escape, Tab, Backspace, Insert, Delete,
; Home, End, PageUp, PageDown, Up/Down/Left/Right, Shift, Ctrl, Alt, Pause, ScrollLock,
; PrintScreen, Tilde, Numpad0..9, NumpadPlus/Minus/Mul/Div, MouseMiddle, MouseX1/X2, None
; или код виртуальной клавиши в виде 0x7A.

[hotkeys]
toggle_ui=F10
toggle_freecam=F11
level_menu=F7
freeze_time=F6
party_to_camera=F4
screenshot=F3
; туман вкл/выкл (для скриншотов)
toggle_fog=F2
; панель освещения: солнце, тени, окружающий свет, цвет, блум, туман, небо (только Drakensang 2008)
lighting_menu=F1

[freecam]
forward=W
back=S
left=A
right=D
up=Space
down=C
roll_left=Q
roll_right=E
fov_in=Z
fov_out=X
reset_roll_fov=Backspace
fast=Shift
slow=Alt
; метры в секунду
speed=6
fast_multiplier=4
slow_multiplier=0.25
; градусы на единицу движения мыши
mouse_sensitivity=0.12
invert_y=0
roll_speed=45
fov_speed=20

[overlay]
; короткие сообщения сверху экрана (1/0)
messages=1
messages_when_ui_hidden=1
font_scale=1.0

[graphics]
; 1 = объекты, персонажи и деревья не пропадают вдали и не отсекаются как «слишком мелкие»
unlimited_draw_distance=1
; 1 = то же для источников света (по умолчанию игра гасит их дальше 50 м; может снизить FPS)
unlimited_light_distance=1
; 1 = рисовать всё, не обращая внимания на «зоны видимости» (игра прячет удалённые части уровня)
ignore_visibility_zones=1
; множитель дальности тумана: 1 = как в игре, 3 = туман втрое дальше, 0 = без тумана
fog_distance=1
; только Drakensang 2008: модели (дома, заборы, бочки, растения) не исчезают дальше 60-150 м,
; а остаются в упрощённом виде (1 = вкл)
unlimited_model_distance=1
; только Drakensang 2008: во сколько раз дальше модели сохраняют полную детализацию (1 = как в игре)
model_detail_distance=2
; дальняя плоскость отсечения камеры в метрах (Drakensang: 2500, River of Time: 3000), 0 = не менять
far_clip=10000
; только Drakensang 2008: во сколько раз дальше деревья сохраняют полную детализацию, а не превращаются в плоские
; картинки (1 = как в игре); действует после загрузки уровня
tree_detail_distance=3

[display]
; 1 = вместо эксклюзивного полноэкранного режима окно без рамки на весь экран
;     (Alt+Tab не сворачивает и не «вешает» игру)
borderless=1

[dev]
log=1
dump_image=0
command_file=0
; дополнительные аргументы движка, например -debug
extra_args=
